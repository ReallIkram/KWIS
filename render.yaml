services:
  - type: web
    name: kwis-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start -w server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: COOKIE_SAME_SITE
        value: lax
      - key: SERVE_CLIENT
        value: 'true'
      - key: VITE_SITE_BASE_PATH
        value: /KWIS/
      - key: VITE_API_BASE_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
