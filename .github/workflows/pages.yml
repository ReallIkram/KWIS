name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w client
      - run: npm run test -w client
      - name: Build public website (no backend credentials required)
        run: npm run build -w client
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_ADMIN_URL: ${{ vars.VITE_ADMIN_URL }}
      - name: Install browser for standalone smoke test
        if: ${{ vars.VITE_API_BASE_URL == '' }}
        run: npx playwright install --with-deps chromium
      - name: Verify website without backend
        if: ${{ vars.VITE_API_BASE_URL == '' }}
        run: npm run test:static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
